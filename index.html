<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Generator — Stability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --cp-yellow:#ffed4e;--cp-red:#ff0055;--cp-cyan:#00d9ff;--cp-purple:#bf40bf;
      --cp-dark:#0d0221;--cp-darker:#030012;--text:#ffed4e;--text-sub:#00d9ff
    }
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Audiowide&display=swap');
    body{
      font-family:'Audiowide','Orbitron',monospace;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;background:linear-gradient(180deg,#0d0221 0%,#030012 50%,#1a0033 100%);
      position:relative;overflow-x:hidden;overflow-y:auto;color:var(--cp-yellow)
    }
    body::before{content:"";position:fixed;inset:0;pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(255,237,78,.02) 0,rgba(255,237,78,.02) 2px,transparent 2px,transparent 4px);
      animation:tvScan .15s linear infinite;z-index:1}
    @keyframes tvScan{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
    body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(circle at 30% 30%,rgba(255,0,85,.08),transparent 40%),
                 radial-gradient(circle at 70% 70%,rgba(0,217,255,.06),transparent 40%)}
    .container{max-width:900px;width:100%;background:rgba(13,2,33,.9);
      backdrop-filter:blur(20px);border:3px solid var(--cp-yellow);border-radius:0;
      padding:60px;position:relative;box-shadow:0 0 60px rgba(255,237,78,.25),inset 0 0 40px rgba(255,237,78,.08),
        0 0 80px rgba(255,0,85,.15)}
    .container::before{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;
      border:3px solid var(--cp-yellow);z-index:-1;animation:borderPulse 2s ease-in-out infinite;opacity:.4}
    @keyframes borderPulse{0%,100%{box-shadow:0 0 20px rgba(255,237,78,.3),inset 0 0 20px rgba(255,237,78,.05)}
      50%{box-shadow:0 0 40px rgba(255,237,78,.6),inset 0 0 30px rgba(255,237,78,.15)}}
    .container::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--cp-yellow),var(--cp-red),transparent);
      animation:scanlineMove 6s linear infinite}
    @keyframes scanlineMove{0%{top:0}100%{top:100%}}
    h1{font-size:3.2rem;font-weight:900;text-align:center;margin-bottom:12px;
      color:var(--cp-yellow);text-transform:uppercase;letter-spacing:4px;
      text-shadow:0 0 10px rgba(255,237,78,.6),0 0 20px rgba(255,0,85,.4),
                  -2px -2px 0 rgba(0,217,255,.5),2px 2px 0 rgba(255,0,85,.5);
      animation:titleGlitch 4s ease-in-out infinite}
    @keyframes titleGlitch{0%,100%{text-shadow:0 0 10px rgba(255,237,78,.6),0 0 20px rgba(255,0,85,.4),
                  -2px -2px 0 rgba(0,217,255,.5),2px 2px 0 rgba(255,0,85,.5)}
      25%{text-shadow:3px 3px 0 rgba(255,0,85,.8),-3px -3px 0 rgba(0,217,255,.8),0 0 20px rgba(255,237,78,.8)}
      50%{text-shadow:-2px 2px 0 rgba(0,217,255,.7),2px -2px 0 rgba(255,0,85,.7),0 0 30px rgba(255,237,78,.7)}
      75%{text-shadow:2px 2px 0 rgba(255,0,85,.8),-2px -2px 0 rgba(0,217,255,.8),0 0 20px rgba(255,237,78,.6)}}
    .subtitle{text-align:center;color:var(--cp-cyan);margin-bottom:40px;font-size:1.1rem;
      letter-spacing:3px;text-transform:uppercase;font-weight:700}
    .form-group{margin-bottom:36px}
    textarea,input{font-family:'Courier New',monospace;width:100%;border:2px solid var(--cp-yellow);
      border-radius:0;padding:18px;font-size:1rem;outline:none;transition:.3s;
      color:var(--cp-yellow);background:rgba(3,0,18,.7);box-shadow:inset 0 0 15px rgba(255,237,78,.08),
        0 0 10px rgba(255,0,85,.1)}
    textarea:focus,input:focus{border-color:var(--cp-red);background:rgba(3,0,18,.95);
      box-shadow:inset 0 0 20px rgba(255,237,78,.15),0 0 30px rgba(255,0,85,.4),
        0 0 50px rgba(0,217,255,.2);color:var(--cp-yellow);text-shadow:0 0 10px rgba(255,237,78,.3)}
    textarea{min-height:160px;resize:vertical;font-size:.95rem}
    .actions{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:40px}
    button{padding:18px 42px;border:3px solid var(--cp-red);background:rgba(255,0,85,.08);
      color:var(--cp-yellow);font-family:'Audiowide',monospace;font-weight:900;font-size:1.1rem;
      cursor:pointer;text-transform:uppercase;letter-spacing:3px;transition:.25s;position:relative;
      box-shadow:0 0 20px rgba(255,0,85,.4),inset 0 0 10px rgba(255,237,78,.05);border-radius:0;
      clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
    button:hover:not(:disabled){border-color:var(--cp-yellow);color:var(--cp-yellow);
      background:rgba(255,237,78,.12);box-shadow:0 0 40px rgba(255,237,78,.6),
        0 0 80px rgba(255,0,85,.4),inset 0 0 20px rgba(255,237,78,.2);
      transform:skewX(-2deg) scale(1.05)}
    button:active:not(:disabled){transform:skewX(-2deg) scale(.98)}
    button:disabled{opacity:.3;cursor:not-allowed}
    .secondary{border-color:var(--cp-cyan);color:var(--cp-cyan);background:rgba(0,217,255,.08)}
    .secondary:hover:not(:disabled){border-color:var(--cp-yellow);color:var(--cp-yellow);
      box-shadow:0 0 40px rgba(0,217,255,.5),0 0 80px rgba(255,237,78,.3)}
    .chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
    .chip{padding:14px 18px;border:2px solid var(--cp-cyan);background:rgba(0,217,255,.06);
      color:var(--cp-cyan);cursor:pointer;font-size:.9rem;font-weight:600;font-family:'Audiowide',monospace;
      transition:.25s;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;
      text-transform:uppercase;letter-spacing:2px;box-shadow:inset 0 0 10px rgba(0,217,255,.08),
        0 0 15px rgba(0,217,255,.2);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
    .chip:hover{border-color:var(--cp-red);color:var(--cp-yellow);background:rgba(255,0,85,.12);
      box-shadow:0 0 30px rgba(255,0,85,.5),0 0 50px rgba(255,237,78,.25),inset 0 0 15px rgba(255,0,85,.1);
      transform:skewY(-1deg)}
    .viewer{display:grid;place-items:center;border:2px solid var(--cp-yellow);border-radius:0;
      min-height:450px;background:linear-gradient(135deg,rgba(3,0,18,.8),rgba(13,2,33,.9));
      transition:.3s;box-shadow:inset 0 0 30px rgba(255,237,78,.1),0 0 30px rgba(255,0,85,.15),
        0 0 60px rgba(0,217,255,.1)}
    .viewer img{max-width:100%;box-shadow:0 0 40px rgba(255,237,78,.5),0 0 80px rgba(255,0,85,.3),
      0 0 120px rgba(0,217,255,.15);filter:contrast(1.2) brightness(1.1);
      animation:imageAppear .7s cubic-bezier(.34,.1,.68,.55)}
    @keyframes imageAppear{from{opacity:0;filter:contrast(.8) brightness(.7) blur(10px);transform:scale(.88) translateY(30px)}
      to{opacity:1;filter:contrast(1.2) brightness(1.1) blur(0);transform:scale(1) translateY(0)}}
    .loading{width:60px;height:60px;border-radius:50%;border:4px solid rgba(255,237,78,.25);
      border-top-color:var(--cp-red);border-right-color:var(--cp-cyan);animation:spin 1.2s linear infinite;
      box-shadow:0 0 30px rgba(255,237,78,.5),inset 0 0 15px rgba(255,0,85,.2),
        0 0 50px rgba(0,217,255,.3)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{color:var(--cp-yellow);background:rgba(255,0,85,.15);border:2px solid var(--cp-red);
      border-left:4px solid var(--cp-red);padding:20px;font-size:1rem;
      box-shadow:0 0 30px rgba(255,0,85,.4);font-family:'Courier New',monospace;
      text-transform:uppercase;letter-spacing:1px}
    .hint{font-size:.9rem;color:var(--cp-cyan);margin-top:18px;text-align:center;
      letter-spacing:2px;text-transform:uppercase;font-weight:600;opacity:.9}
    .label{font-weight:900;margin-bottom:12px;color:var(--cp-red);font-size:1rem;
      text-transform:uppercase;letter-spacing:2px}
  </style>
</head>
<body>
  <div class="container">
    <h1>BRAINDANCE RENDERER</h1>
    <p class="subtitle">Neural Link v4.7 — NCPD Approved Neural Synthesis Engine</p>

    <div class="form-group">
      <div class="label">▓▓▓ MEMORY INPUT SEQUENCE</div>
      <textarea id="prompt" placeholder=">> E.g. Neon Tokyo street, rain reflections, holographic advertisements, cybernetic soldiers, volumetric fog, 8K, cinematic..."></textarea>
    </div>

    <div class="chips" id="examples"></div>

    <div class="viewer" id="viewer">
      <div class="hint">▒ [INTERFACE] NEURAL LINK READY ▒</div>
    </div>

    <div class="actions">
      <button id="generateBtn">⚡ JACK IN</button>
      <button id="downloadBtn" class="secondary" disabled">📥 EXFIL DATA</button>
    </div>

    <p class="hint">[ CTRL+ENTER ] — NEURAL SPIKE | EMERGENCY DISCONNECT</p>
  </div>

  <script>
    // Demo example chips
    const presets = [
      'A futuristic cyberpunk city at night with neon rain, cinematic, moody, volumetric lighting',
      'A whimsical watercolor illustration of a fox reading under a lantern in a forest',
      'Ultra‑realistic portrait of an astronaut in a sunflower field, 85mm, shallow depth of field'
    ];
    const chips = document.getElementById('examples');
    presets.forEach(txt=>{
      const b=document.createElement('button');
      b.className='chip'; b.textContent=txt.slice(0,48)+'…';
      b.title=txt; b.onclick=()=>{document.getElementById('prompt').value=txt};
      chips.appendChild(b);
    });

    const btn = document.getElementById('generateBtn');
    const dlBtn = document.getElementById('downloadBtn');
    const viewer = document.getElementById('viewer');

    async function generate(){
      const prompt = document.getElementById('prompt').value.trim();
      if(!prompt){ alert('⚠️ [NEURAL INTERFACE ERROR]\n>> Memory sequence empty. Input synthesis parameters.'); return; }

      const btn = document.getElementById('generateBtn');
      const dlBtn = document.getElementById('downloadBtn');
      const viewer = document.getElementById('viewer');

      btn.disabled = true; dlBtn.disabled = true; btn.textContent = '⚡ JACKING IN...';
      viewer.innerHTML = '<div class="loading"></div>';

      try {
        const resp = await fetch('/api/generate', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ prompt, size: '1024x1024' })
        });

        const ct = resp.headers.get('content-type') || '';
        let data = null, text = null;
        if (ct.includes('application/json')) {
          data = await resp.json();
        } else {
          text = await resp.text();
        }

        if (!resp.ok) {
          const msg = (data && data.error) || text || `HTTP ${resp.status}`;
          throw new Error(msg);
        }

        if (!data?.base64) {
          throw new Error('Braindance corrupted: Empty neural response.');
        }

        const img = new Image();
        img.onload = () => { viewer.innerHTML=''; viewer.appendChild(img); dlBtn.disabled=false; };
        img.style.maxWidth='100%';
        img.src = `data:image/png;base64,${data.base64}`;

        dlBtn.onclick = () => {
          const a = document.createElement('a'); a.href = img.src; a.download = 'braindance_dump.png'; a.click();
        };

      } catch (err) {
        console.error(err);
        viewer.innerHTML = `<div class="error">▲ CRITICAL NEURAL FAILURE ▲<br/>> [${err.message}]<br/>DISCONNECT IMMEDIATELY</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '⚡ JACK IN';
      }
    }

    btn.addEventListener('click', generate);
    document.addEventListener('keydown', (e)=>{
      if((e.ctrlKey||e.metaKey) && e.key==='Enter') generate();
    });
  </script>
</body>
</html>
